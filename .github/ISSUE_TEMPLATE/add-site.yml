name: 레퍼런스 사이트 추가
description: 레퍼런스 선반(rawfawv.github.io/refs)에 사이트를 올려요
title: "[사이트 추가] "
labels: ["site"]
body:
  - type: markdown
    attributes:
      value: 제출하면 바로 [레퍼런스 선반](https://rawfawv.github.io/refs/)에 카드로 올라가요. 선반에서 빼려면 이 이슈를 닫으면 돼요.
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://example.com
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 이름
      description: 비우면 도메인으로 표시돼요
  - type: input
    id: category
    attributes:
      label: 분류
      placeholder: 커머스, 포트폴리오, 브랜드, 에디토리얼…
  - type: textarea
    id: note
    attributes:
      label: 메모
      description: 어떤 점이 좋은지 한 줄로
  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷 (선택)
      description: 이미지를 여기에 끌어놓으면 썸네일로 써요. 비우면 사이트 화면을 자동으로 캡처해요.
