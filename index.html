<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="the play ground — rawfawv portfolio">
    <title>the play ground — rawfawv</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">

    <!-- ── Sidebar ── -->
    <aside class="sidebar" aria-label="Site navigation">
        <div class="sidebar-brand">
            <h1 aria-label="the play ground">theplayground</h1>
        </div>
        <footer class="sidebar-footer">
            <span class="author-name">Jiwoon Chung</span>
        </footer>
    </aside>

    <!-- ── Gallery ── -->
    <main class="gallery-wrapper" aria-label="Portfolio gallery">

        <!-- View toggle -->
        <div class="view-toggle" aria-label="View mode">
            <button class="toggle-btn active" id="btn-shelf" aria-label="Shelf view" title="Shelf view">
                <svg width="28" height="22" viewBox="0 0 28 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="0" y="0"  width="28" height="6" fill="currentColor"/>
                    <rect x="0" y="8"  width="28" height="6" fill="currentColor"/>
                    <rect x="0" y="16" width="28" height="6" fill="currentColor"/>
                </svg>
            </button>
            <button class="toggle-btn" id="btn-grid" aria-label="Grid view" title="Grid view">
                <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="0"  y="0"  width="6" height="6" fill="currentColor"/>
                    <rect x="8"  y="0"  width="6" height="6" fill="currentColor"/>
                    <rect x="16" y="0"  width="6" height="6" fill="currentColor"/>
                    <rect x="0"  y="8"  width="6" height="6" fill="currentColor"/>
                    <rect x="8"  y="8"  width="6" height="6" fill="currentColor"/>
                    <rect x="16" y="8"  width="6" height="6" fill="currentColor"/>
                    <rect x="0"  y="16" width="6" height="6" fill="currentColor"/>
                    <rect x="8"  y="16" width="6" height="6" fill="currentColor"/>
                    <rect x="16" y="16" width="6" height="6" fill="currentColor"/>
                </svg>
            </button>
        </div>

        <!-- ── SHELF VIEW ── -->
        <div class="gallery-container" id="gallery-container">
            <div class="shelf-line" aria-hidden="true"></div>
            <div class="gallery-instruction" aria-hidden="true">
                <span class="drag-arrow">◀</span>
                <span class="drag-text">DRAG TO EXPLORE</span>
                <span class="drag-arrow">▶</span>
            </div>
            <div class="gallery-track" id="shelf-track" role="list"></div>
        </div>

        <!-- ── GRID VIEW ── -->
        <div class="grid-container" id="grid-container" aria-hidden="true">
            <div class="grid-track" id="grid-track"></div>
        </div>

    </main>

</div>

<script>
/* ============================================================
   포트폴리오 데이터 — 여기만 수정하면 한줄보기/모아보기 모두 반영
   ============================================================
   link: 클릭 시 이동할 URL (없으면 null)
   small: true면 이미지 크기 축소 (선택)
   ============================================================ */
const PROJECTS = [
    {
        id: '01',
        title: '생선게임',
        image: 'assets/4.png',
        link: 'https://rawfawv.github.io/fish-game/',
        small: true,
    },
    {
        id: '02',
        title: 'ORANGE MONOBLOCK',
        image: 'assets/1.png',
        link: null,
        small: false,
    },
    {
        id: '03',
        title: 'FORM & UNTERSCHIED',
        image: 'assets/2.png',
        link: null,
        small: false,
    },
];

/* ── 한줄보기 렌더링 ── */
function renderShelf() {
    const track = document.getElementById('shelf-track');
    track.innerHTML = PROJECTS.map((p, i) => {
        const imgTag = `<img src="${p.image}" alt="${p.title}" draggable="false" loading="eager">`;
        const visual = p.link
            ? `<a href="${p.link}" target="_blank" rel="noopener">${imgTag}</a>`
            : imgTag;

        return `
        <article class="gallery-item${p.small ? ' gallery-item--small' : ''}" role="listitem" data-index="${p.id}">
            <div class="item-visual">${visual}</div>
            <div class="item-info" aria-hidden="true">
                <h2 class="item-title">${p.title}</h2>
            </div>
        </article>`;
    }).join('');
}

/* ── 모아보기 렌더링 ── */
function renderGrid() {
    const track = document.getElementById('grid-track');
    track.innerHTML = PROJECTS.map(p => {
        const imgTag = `<img src="${p.image}" alt="${p.title}" draggable="false">`;
        const visual = p.link
            ? `<a href="${p.link}" target="_blank" rel="noopener">${imgTag}</a>`
            : imgTag;

        return `
        <article class="grid-item">
            <div class="grid-visual">${visual}</div>
            <div class="grid-info">
                <h2 class="grid-title">${p.title}</h2>
            </div>
        </article>`;
    }).join('');
}

renderShelf();
renderGrid();
</script>

<script src="main.js"></script>
</body>
</html>
