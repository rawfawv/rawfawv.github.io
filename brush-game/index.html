<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>붓 - 한글 획순서 애니메이션</title>
  <style>
    @font-face {
      font-family: 'CustomFont';
      src: url('BAEMINWORK.otf') format('opentype');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #f5f5f5;
      font-family: 'Apple SD Gothic Neo', sans-serif;
      color: #333;
      display: flex;
      overflow: hidden;
    }
    a#home-btn {
      position: fixed; top: 20px; left: 20px; z-index: 500;
      font-size: 28px; color: #333; text-decoration: none; opacity: 0.7;
    }
    a#home-btn:hover { opacity: 1; }

    #controls {
      width: 320px; min-height: 100vh; max-height: 100vh; background: #ffffff;
      padding: 80px 24px 24px; display: flex; flex-direction: column; gap: 14px;
      border-right: 1px solid #e0e0e0;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-group label { font-size: 11px; color: #666; text-transform: uppercase; font-weight: 600; }
    .control-row { display: flex; align-items: center; gap: 10px; }
    .range-value { font-size: 12px; color: #666; min-width: 45px; text-align: right; }
    .control-group input[type="range"] { width: 100%; accent-color: #4ade80; }
    .control-group input[type="color"] { width: 50px; height: 32px; border: 1px solid #ddd; border-radius: 4px; }

    /* 자소 선택 버튼 */
    .jamo-section { margin-bottom: 12px; }
    .jamo-section-title { font-size: 12px; color: #888; margin-bottom: 6px; }
    .jamo-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .jamo-btn {
      padding: 8px 4px;
      background: #f9f9f9;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 16px;
      font-family: 'CustomFont', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
    }
    .jamo-btn:hover { border-color: #4ade80; background: #f0fdf4; }
    .jamo-btn.active { border-color: #4ade80; background: #4ade80; color: #fff; }
    .jamo-btn.disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-group { display: flex; gap: 8px; margin-top: 8px; }
    .btn {
      flex: 1; padding: 12px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: #4ade80; color: #000; }
    .btn-secondary { background: #e5e5e5; color: #333; }

    .bg-btns { display: flex; gap: 6px; }
    .bg-btn {
      flex: 1; padding: 8px; background: #f9f9f9; border: 2px solid #ddd;
      border-radius: 6px; font-size: 11px; cursor: pointer; text-align: center;
    }
    .bg-btn:hover { border-color: #bbb; }
    .bg-btn.active { border-color: #4ade80; background: #f0fdf4; color: #16a34a; }

    .info-box {
      padding: 10px; background: #f0fdf4; border: 1px solid #4ade80;
      border-radius: 6px; font-size: 12px; color: #16a34a;
    }

    /* 캔버스 영역 */
    #canvas-area {
      flex: 1; position: relative;
      display: flex; align-items: center; justify-content: center;
      background: #ffffff;
      overflow: hidden;
    }
    #preview-svg {
      width: 400px; height: 400px;
    }
    .stroke-path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .stroke-guide {
      fill: none;
      stroke: #e0e0e0;
      stroke-width: 8;
      stroke-linecap: round;
    }
    @keyframes drawStroke {
      to { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <a href="../index.html" id="home-btn">←</a>

  <div id="controls">
    <div class="info-box">
      <strong>사용법:</strong> 자소를 선택하고 재생 버튼을 누르면 획 순서대로 글자가 써집니다.
    </div>

    <div class="control-group">
      <label>초성 선택</label>
      <div class="jamo-grid" id="cho-grid"></div>
    </div>

    <div class="control-group">
      <label>중성 선택</label>
      <div class="jamo-grid" id="jung-grid"></div>
    </div>

    <div class="control-group">
      <label>종성 선택 (선택사항)</label>
      <div class="jamo-grid" id="jong-grid"></div>
    </div>

    <div class="control-group">
      <label>조합 결과</label>
      <div id="result-char" style="font-size:48px; font-family:'CustomFont'; text-align:center; padding:10px;">-</div>
    </div>

    <div class="control-group">
      <label>획 굵기</label>
      <div class="control-row">
        <input type="range" id="strokeWidth" min="4" max="20" value="10">
        <span class="range-value" id="strokeWidthVal">10px</span>
      </div>
    </div>

    <div class="control-group">
      <label>획 속도</label>
      <div class="control-row">
        <input type="range" id="strokeSpeed" min="0.1" max="1" step="0.1" value="0.4">
        <span class="range-value" id="strokeSpeedVal">0.4s</span>
      </div>
    </div>

    <div class="control-group">
      <label>글자 색상</label>
      <input type="color" id="strokeColor" value="#000000">
    </div>

    <div class="control-group">
      <label>배경색 (내보내기용)</label>
      <div class="bg-btns">
        <button class="bg-btn active" data-bg="#ffffff">화이트</button>
        <button class="bg-btn" data-bg="#03ff00">그린스크린</button>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" id="playBtn">▶ 재생</button>
      <button class="btn btn-secondary" id="resetBtn">↺ 리셋</button>
    </div>

    <div class="control-group" style="margin-top:8px;">
      <label>내보내기</label>
      <div class="btn-group">
        <button class="btn" id="mp4Btn" style="background:#888; color:#fff;">MP4</button>
        <button class="btn" id="pngBtn" style="background:#888; color:#fff;">PNG</button>
      </div>
    </div>
  </div>

  <div id="canvas-area">
    <svg id="preview-svg" viewBox="0 0 400 400"></svg>
  </div>

  <canvas id="recordCanvas" style="display:none;"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>

    ],

  // 모음 유형 판단 (배치 결정용)
  function getJungType(jung) {
    var vertical = ['ㅏ','ㅐ','ㅑ','ㅓ','ㅔ','ㅕ','ㅣ'];
    var horizontal = ['ㅗ','ㅛ','ㅜ','ㅠ','ㅡ'];
    if (vertical.indexOf(jung) >= 0) return 'vertical';
    if (horizontal.indexOf(jung) >= 0) return 'horizontal';
    return 'combined';
  }

  // 한글 조합
  function combineHangul(cho, jung, jong) {
    if (!cho || !jung) return null;
    var choIdx = choList.indexOf(cho);
    var jungIdx = jungList.indexOf(jung);
    var jongIdx = jongList.indexOf(jong || '');
    if (choIdx < 0 || jungIdx < 0 || jongIdx < 0) return null;
    
    // 확장 초성 인덱스로 변환
    var extChoIdx = [0,2,3,5,6,7,9,11,12,14,15,16,17,18][choIdx];
    var code = 0xAC00 + (extChoIdx * 588) + (jungIdx * 28) + jongIdx;
    return String.fromCharCode(code);
  }

  // UI 생성
  function createJamoButtons() {
    var choGrid = document.getElementById('cho-grid');
    var jungGrid = document.getElementById('jung-grid');
    var jongGrid = document.getElementById('jong-grid');

    choList.forEach(function(j) {
      var btn = document.createElement('button');
      btn.className = 'jamo-btn';
      btn.textContent = j;
      btn.onclick = function() { selectJamo('cho', j, btn); };
      choGrid.appendChild(btn);
    });

    jungList.forEach(function(j) {
      var btn = document.createElement('button');
      btn.className = 'jamo-btn';
      btn.textContent = j;
      btn.onclick = function() { selectJamo('jung', j, btn); };
      jungGrid.appendChild(btn);
    });

    jongList.forEach(function(j, i) {
      var btn = document.createElement('button');
      btn.className = 'jamo-btn';
      btn.textContent = j || '없음';
      if (i === 0) btn.classList.add('active');
      btn.onclick = function() { selectJamo('jong', j, btn); };
      jongGrid.appendChild(btn);
    });
  }

  function selectJamo(type, jamo, btn) {
    var grid = btn.parentElement;
    grid.querySelectorAll('.jamo-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');

    if (type === 'cho') selectedCho = jamo;
    else if (type === 'jung') selectedJung = jamo;
    else selectedJong = jamo;

    updatePreview();
  }

  // 미리보기 업데이트
  function updatePreview() {
    var resultChar = document.getElementById('result-char');
    var svg = document.getElementById('preview-svg');
    
    if (!selectedCho || !selectedJung) {
      resultChar.textContent = '-';
      svg.innerHTML = '<text x="200" y="220" text-anchor="middle" fill="#ddd" font-size="24">자소를 선택하세요</text>';
      return;
    }

    var char = combineHangul(selectedCho, selectedJung, selectedJong);
    resultChar.textContent = char || '-';

    // 가이드 라인 (옅은 색으로 전체 획 표시)
    var allStrokes = getStrokesForChar();
    var guideSvg = '';
    allStrokes.forEach(function(s) {
      guideSvg += '<path class="stroke-guide" d="' + s.d + '"/>';
    });
    
    svg.innerHTML = guideSvg;
  }

  // 현재 글자의 모든 획 가져오기
  function getStrokesForChar() {
    var strokes = [];
    var jungType = getJungType(selectedJung);
    var hasJong = selectedJong && selectedJong !== '';
    var scale = 4; // viewBox 100 -> 400

    // 위치 조정 함수
    function transformPath(pathD, offsetX, offsetY, scaleX, scaleY) {
      return pathD.replace(/([ML])\s*([\d.]+)\s+([\d.]+)/g, function(match, cmd, x, y) {
        var nx = (parseFloat(x) + offsetX) * scaleX;
        var ny = (parseFloat(y) + offsetY) * scaleY;
        return cmd + ' ' + nx.toFixed(1) + ' ' + ny.toFixed(1);
      }).replace(/A\s*([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/g, 
        function(match, rx, ry, rot, large, sweep, x, y) {
          var nrx = parseFloat(rx) * scaleX;
          var nry = parseFloat(ry) * scaleY;
          var nx = (parseFloat(x) + offsetX) * scaleX;
          var ny = (parseFloat(y) + offsetY) * scaleY;
          return 'A ' + nrx.toFixed(1) + ' ' + nry.toFixed(1) + ' ' + rot + ' ' + large + ' ' + sweep + ' ' + nx.toFixed(1) + ' ' + ny.toFixed(1);
        });
    }

    // 초성 획
    var choKey = selectedCho + '_cho';
    if (jamoStrokes[choKey]) {
      var choOffsetX = 0, choOffsetY = 0, choScaleX = scale, choScaleY = scale;
      
      // 모음 유형에 따라 초성 위치/크기 조정
      if (jungType === 'vertical') {
        // 세로 모음: 초성이 왼쪽 위
        choOffsetX = -5;
        choOffsetY = hasJong ? -5 : 0;
        choScaleX = hasJong ? 3.5 : 4;
        choScaleY = hasJong ? 3 : 3.5;
      } else {
        // 가로 모음: 초성이 위쪽 전체
        choOffsetX = 10;
        choOffsetY = hasJong ? -10 : -5;
        choScaleX = hasJong ? 3.5 : 4;
        choScaleY = hasJong ? 2.5 : 3;
      }
      
      jamoStrokes[choKey].forEach(function(d) {
        strokes.push({ d: transformPath(d, choOffsetX, choOffsetY, choScaleX, choScaleY), type: 'cho' });
      });
    }

    // 중성 획
    var jungKey = selectedJung + '_jung';
    if (jamoStrokes[jungKey]) {
      var jungOffsetX = 0, jungOffsetY = 0, jungScaleX = scale, jungScaleY = scale;
      
      if (jungType === 'vertical') {
        jungOffsetX = hasJong ? -5 : 0;
        jungOffsetY = hasJong ? -5 : 0;
        jungScaleX = hasJong ? 3.5 : 4;
        jungScaleY = hasJong ? 3 : 3.5;
      } else {
        jungOffsetX = hasJong ? 5 : 10;
        jungOffsetY = hasJong ? 20 : 30;
        jungScaleX = hasJong ? 3.5 : 4;
        jungScaleY = hasJong ? 2.5 : 3;
      }
      
      jamoStrokes[jungKey].forEach(function(d) {
        strokes.push({ d: transformPath(d, jungOffsetX, jungOffsetY, jungScaleX, jungScaleY), type: 'jung' });
      });
    }

    // 종성 획
    if (hasJong) {
      var jongKey = selectedJong + '_jong';
      if (jamoStrokes[jongKey]) {
        var jongOffsetX = 5, jongOffsetY = 50;
        var jongScaleX = 4, jongScaleY = 3;
        
        jamoStrokes[jongKey].forEach(function(d) {
          strokes.push({ d: transformPath(d, jongOffsetX, jongOffsetY, jongScaleX, jongScaleY), type: 'jong' });
        });
      }
    }

    return strokes;
  }

  // 재생
  function play() {
    if (!selectedCho || !selectedJung) {
      alert('초성과 중성을 선택해주세요!');
      return;
    }

    var svg = document.getElementById('preview-svg');
    var strokes = getStrokesForChar();
    var strokeWidth = document.getElementById('strokeWidth').value;
    var strokeSpeed = parseFloat(document.getElementById('strokeSpeed').value);
    var strokeColor = document.getElementById('strokeColor').value;

    var svgContent = '';
    
    // 가이드 라인
    strokes.forEach(function(s) {
      svgContent += '<path class="stroke-guide" d="' + s.d + '"/>';
    });

    // 애니메이션 획
    var delay = 0;
    strokes.forEach(function(s, i) {
      var pathLen = 500; // 대략적인 경로 길이
      svgContent += '<path class="stroke-path" d="' + s.d + '" ' +
        'stroke="' + strokeColor + '" stroke-width="' + strokeWidth + '" ' +
        'style="stroke-dasharray:' + pathLen + ';stroke-dashoffset:' + pathLen + ';' +
        'animation:drawStroke ' + strokeSpeed + 's ease-out ' + delay + 's forwards;"/>';
      delay += strokeSpeed * 0.7;
    });

    svg.innerHTML = svgContent;
  }

  // 리셋
  function reset() {
    updatePreview();
  }

  // MP4 내보내기
  async function exportMP4() {
    if (!selectedCho || !selectedJung) {
      alert('초성과 중성을 선택해주세요!');
      return;
    }

    var btn = document.getElementById('mp4Btn');
    btn.textContent = '생성 중...';
    btn.disabled = true;

    var canvas = document.getElementById('recordCanvas');
    var ctx = canvas.getContext('2d');
    var size = 400;
    canvas.width = size;
    canvas.height = size;

    var strokes = getStrokesForChar();
    var strokeWidth = parseInt(document.getElementById('strokeWidth').value);
    var strokeSpeed = parseFloat(document.getElementById('strokeSpeed').value);
    var strokeColor = document.getElementById('strokeColor').value;

    var fps = 30;
    var totalDuration = strokes.length * strokeSpeed * 0.7 + strokeSpeed;
    var totalFrames = Math.ceil(totalDuration * fps);

    // WebCodecs 지원 확인
    if (typeof VideoEncoder === 'undefined') {
      alert('이 브라우저는 MP4 내보내기를 지원하지 않습니다. Chrome 최신 버전을 사용해주세요.');
      btn.textContent = 'MP4';
      btn.disabled = false;
      return;
    }

    var muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec: 'avc', width: size, height: size },
      fastStart: 'in-memory'
    });

    var encoder = new VideoEncoder({
      output: function(chunk, meta) { muxer.addVideoChunk(chunk, meta); },
      error: function(e) { console.error(e); }
    });

    await encoder.configure({
      codec: 'avc1.42001f',
      width: size, height: size,
      bitrate: 5000000, framerate: fps
    });

    // 프레임 생성
    for (var f = 0; f <= totalFrames; f++) {
      var time = f / fps;
      
      ctx.fillStyle = exportBgColor;
      ctx.fillRect(0, 0, size, size);

      // 가이드
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      strokes.forEach(function(s) {
        var path = new Path2D(s.d);
        ctx.stroke(path);
      });

      // 애니메이션 획
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = strokeWidth;
      var delay = 0;
      strokes.forEach(function(s) {
        var progress = Math.max(0, Math.min(1, (time - delay) / strokeSpeed));
        if (progress > 0) {
          ctx.save();
          ctx.beginPath();
          // 간단한 진행률 표현 (전체 또는 미표시)
          if (progress >= 1) {
            var path = new Path2D(s.d);
            ctx.stroke(path);
          }
          ctx.restore();
        }
        delay += strokeSpeed * 0.7;
      });

      var frame = new VideoFrame(canvas, { timestamp: f * (1000000 / fps) });
      encoder.encode(frame, { keyFrame: f % 30 === 0 });
      frame.close();

      btn.textContent = 'MP4 ' + Math.round((f / totalFrames) * 100) + '%';
    }

    await encoder.flush();
    encoder.close();
    muxer.finalize();

    var blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'hangul-stroke-' + Date.now() + '.mp4';
    a.click();

    btn.textContent = 'MP4';
    btn.disabled = false;
  }

  // PNG 시퀀스 내보내기
  function exportPNG() {
    if (!selectedCho || !selectedJung) {
      alert('초성과 중성을 선택해주세요!');
      return;
    }

    var btn = document.getElementById('pngBtn');
    btn.textContent = '생성 중...';
    btn.disabled = true;

    var canvas = document.getElementById('recordCanvas');
    var ctx = canvas.getContext('2d');
    var size = 400;
    canvas.width = size;
    canvas.height = size;

    var strokes = getStrokesForChar();
    var strokeWidth = parseInt(document.getElementById('strokeWidth').value);
    var strokeSpeed = parseFloat(document.getElementById('strokeSpeed').value);
    var strokeColor = document.getElementById('strokeColor').value;

    var fps = 30;
    var totalDuration = strokes.length * strokeSpeed * 0.7 + strokeSpeed;
    var totalFrames = Math.ceil(totalDuration * fps);

    var zip = new JSZip();

    for (var f = 0; f <= totalFrames; f++) {
      var time = f / fps;
      
      ctx.fillStyle = exportBgColor;
      ctx.fillRect(0, 0, size, size);

      // 가이드
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      strokes.forEach(function(s) {
        var path = new Path2D(s.d);
        ctx.stroke(path);
      });

      // 완료된 획만 그리기
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = strokeWidth;
      var delay = 0;
      strokes.forEach(function(s) {
        var progress = Math.max(0, Math.min(1, (time - delay) / strokeSpeed));
        if (progress >= 1) {
          var path = new Path2D(s.d);
          ctx.stroke(path);
        }
        delay += strokeSpeed * 0.7;
      });

      var dataUrl = canvas.toDataURL('image/png');
      var base64 = dataUrl.split(',')[1];
      zip.file('frame_' + String(f).padStart(4, '0') + '.png', base64, { base64: true });
    }

    btn.textContent = 'ZIP 압축...';
    zip.generateAsync({ type: 'blob' }).then(function(content) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(content);
      a.download = 'hangul-stroke-' + Date.now() + '.zip';
      a.click();
      btn.textContent = 'PNG';
      btn.disabled = false;
    });
  }

  // 이벤트 바인딩
  document.getElementById('playBtn').onclick = play;
  document.getElementById('resetBtn').onclick = reset;
  document.getElementById('mp4Btn').onclick = exportMP4;
  document.getElementById('pngBtn').onclick = exportPNG;

  document.getElementById('strokeWidth').oninput = function() {
    document.getElementById('strokeWidthVal').textContent = this.value + 'px';
  };
  document.getElementById('strokeSpeed').oninput = function() {
    document.getElementById('strokeSpeedVal').textContent = this.value + 's';
  };

  document.querySelectorAll('.bg-btn').forEach(function(btn) {
    btn.onclick = function() {
      document.querySelectorAll('.bg-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      exportBgColor = btn.dataset.bg;
      document.getElementById('canvas-area').style.background = exportBgColor;
    };
  });

  // 초기화
  createJamoButtons();
  updatePreview();
})();
</script>
</body>
</html>
